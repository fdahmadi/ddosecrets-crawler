[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddosecrets-crawler"
version = "0.1.0"
description = "Polite incremental mirror crawler for ddosecrets.org and subdomains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "PyYAML>=6.0",
  "rich>=13.0.0",
  "feedparser>=6.0.0",
  "tenacity>=8.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
ddosecrets-crawler = "ddosecrets_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddosecrets_crawler = [
  "web/templates/*.html",
  "web/static/*",
  "web/static/*.css",
]