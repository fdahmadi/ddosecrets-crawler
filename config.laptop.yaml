# Laptop preview config: slow + metadata/HTML only (no bulk file/torrent downloads)

mirror_root: ./mirror
state_db: ./state/mirror.db
catalog_db: ./state/catalog.db
user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

seeds:
  - https://ddosecrets.org/
  - https://data.ddosecrets.org/
  - https://torrents.ddosecrets.org/

allowed_host_suffixes:
  - ddosecrets.org

# Slow human-like pacing for laptop preview
polite:
  min_delay: 8.0
  max_delay: 20.0
  burst_pause_every: 10
  burst_pause_min: 45.0
  burst_pause_max: 120.0
  max_concurrent_http: 1
  retry_max: 3
  retry_backoff_base: 8.0
  timeout: 60.0

site:
  enabled: true
  save_html: true
  follow_static: false      # skip CSS/JS/images for preview
  max_pages: 25             # small sample on laptop
  respect_query_params: false

data:
  enabled: true
  prefer_torrent: true
  http_fallback: false      # do not HTTP-download datasets
  max_file_bytes: 1         # refuse real file payloads
  max_indexes: 3            # only a few directory pages
  skip_extensions: []
  recurse_directories: true

torrent:
  enabled: true
  magnets_csv: https://torrents.ddosecrets.org/magnets.csv
  releases_rss: https://torrents.ddosecrets.org/releases.xml
  site_rss: https://ddosecrets.org/feed/rss.xml
  download_dir: ./mirror/torrents
  aria2_rpc: null
  aria2_secret: null
  use_cli: false            # do not start aria2 downloads
  max_concurrent_torrents: 0
  seed_ratio: 1.0
  seed_time_minutes: 60

schedule:
  site_interval_hours: 1
  data_index_interval_hours: 6
  torrent_index_interval_hours: 3
  full_reconcile_days: 7
  continuous: true
  batch_pause_seconds: 20
  idle_sleep_seconds: 120

logging:
  level: INFO
  file: ./logs/crawler.laptop.log