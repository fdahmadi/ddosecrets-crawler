# Docker laptop preview — slow, metadata/HTML only, no bulk downloads

mirror_root: /data/mirror
state_db: /data/state/mirror.db
catalog_db: /data/state/catalog.db
user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

seeds:
  - https://ddosecrets.org/
  - https://data.ddosecrets.org/
  - https://torrents.ddosecrets.org/

allowed_host_suffixes:
  - ddosecrets.org

polite:
  min_delay: 8.0
  max_delay: 20.0
  burst_pause_every: 10
  burst_pause_min: 45.0
  burst_pause_max: 120.0
  max_concurrent_http: 1
  retry_max: 3
  retry_backoff_base: 8.0
  timeout: 60.0

site:
  enabled: true
  save_html: true
  follow_static: false
  max_pages: 25
  respect_query_params: false

data:
  enabled: true
  prefer_torrent: true
  http_fallback: false
  max_file_bytes: 1
  max_indexes: 3
  skip_extensions: []
  recurse_directories: true

torrent:
  enabled: true
  magnets_csv: https://torrents.ddosecrets.org/magnets.csv
  releases_rss: https://torrents.ddosecrets.org/releases.xml
  site_rss: https://ddosecrets.org/feed/rss.xml
  download_dir: /data/mirror/torrents
  aria2_rpc: null
  aria2_secret: null
  use_cli: false
  max_concurrent_torrents: 0
  seed_ratio: 1.0
  seed_time_minutes: 60

schedule:
  site_interval_hours: 1
  data_index_interval_hours: 6
  torrent_index_interval_hours: 3
  full_reconcile_days: 7
  continuous: true
  batch_pause_seconds: 20
  idle_sleep_seconds: 120

logging:
  level: INFO
  file: /data/logs/crawler.laptop.log