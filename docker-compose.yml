# Crawler + UI. PostgreSQL and MinIO are expected on separate servers.
# Config YAML is baked into the image. Connection details come from .env
# (DATABASE_URL, MINIO_*, STORAGE_BACKEND) and override the YAML.
#
# Server (compose file + .env only, image already present):
#   docker compose up -d
#   open http://localhost:8090          (admin)
#   open http://localhost:8091/         (ddosecrets.org mirror)
#   open http://localhost:8092/         (data.ddosecrets.org mirror)
#   open http://localhost:8093/         (torrents.ddosecrets.org mirror)
#
# Build on a machine that has the source tree:
#   docker compose up -d --build
#
# Laptop preview (image must contain config.docker.laptop.yaml):
#   CONFIG_NAME=config.docker.laptop.yaml docker compose up -d
#
# Required env (example .env):
#   DATABASE_URL=postgresql://user:pass@db-host:5432/ddosecrets
#   MINIO_ENDPOINT=minio-host:9000
#   MINIO_ACCESS_KEY=...
#   MINIO_SECRET_KEY=...
#   MINIO_BUCKET=ddosecrets-mirror
#
# Stop:
#   docker compose down

services:
  ui:
    build: .
    image: ddosecrets-crawler:latest
    container_name: ddosecrets-ui
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
    volumes:
      - ./staging:/data/staging
      - ./logs:/data/logs
    environment:
      - TZ=Asia/Tehran
      - DATABASE_URL=${DATABASE_URL:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-ddosecrets-mirror}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
    command:
      [
        "serve",
        "-c",
        "/app/${CONFIG_NAME:-config.docker.yaml}",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]

  scheduler:
    build: .
    image: ddosecrets-crawler:latest
    container_name: ddosecrets-scheduler
    restart: unless-stopped
    volumes:
      - ./staging:/data/staging
      - ./logs:/data/logs
    environment:
      - TZ=Asia/Tehran
      - DATABASE_URL=${DATABASE_URL:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-ddosecrets-mirror}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
    command: ["schedule", "-c", "/app/${CONFIG_NAME:-config.docker.yaml}"]
    depends_on:
      - ui

  crawler:
    build: .
    image: ddosecrets-crawler:latest
    profiles: ["manual"]
    volumes:
      - ./staging:/data/staging
      - ./logs:/data/logs
    environment:
      - TZ=Asia/Tehran
      - DATABASE_URL=${DATABASE_URL:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-ddosecrets-mirror}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
    command: ["status", "-c", "/app/${CONFIG_NAME:-config.docker.yaml}"]
